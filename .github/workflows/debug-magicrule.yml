name: Debug-MagicRule

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug YouTube in Actions
        run: |
          curl -sS -D /tmp/headers.txt -o /tmp/body.txt \
            "https://magicrule.pages.dev/data/_shared/artifacts/YouTube_rules_329ca26de78c21fe.list"
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== BODY (first 5 lines) ==="
          head -n 5 /tmp/body.txt
